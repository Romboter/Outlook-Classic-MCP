name: Rust Foundation CI

on:
  push:
    branches:
      - 'feat/rust-*'
      - 'fix/rust-*'
    paths:
      - 'rust/**'
      - 'CLAUDE.md'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'CLAUDE.md'
      - '.github/workflows/rust-ci.yml'
  workflow_dispatch:

jobs:
  rust:
    name: Build, lint, test (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Generate updated lockfile for schemars direct dependency (temporary)
        run: cargo generate-lockfile --manifest-path rust/Cargo.toml
      - name: Emit updated Cargo.lock for review (temporary)
        shell: pwsh
        run: |
          Write-Output 'BEGIN_SCHEMA_LOCK'
          Write-Output ([Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path rust/Cargo.lock))))
          Write-Output 'END_SCHEMA_LOCK'
      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Lint
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Run unit tests
        run: cargo test --locked --manifest-path rust/Cargo.toml --all-targets
      - name: Build
        run: cargo build --locked --manifest-path rust/Cargo.toml
      - name: Check that server help works
        shell: pwsh
        run: |
          & .\rust\target\debug\outlook-mcp-rs.exe --version
          & .\rust\target\debug\outlook-mcp-rs.exe --help
