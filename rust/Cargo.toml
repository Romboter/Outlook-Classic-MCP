[package]
name = "outlook-classic-mcp-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Windows-native Rust rewrite of Outlook Classic MCP (foundation stage)"
license = "MIT"
publish = false

[[bin]]
name = "outlook-mcp-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io", "elicitation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole",
  "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_System_SystemInformation", "Win32_System_Time"
] }
