name: Rust Foundation CI

on:
  push:
    branches:
      - 'feat/rust-*'
      - 'fix/rust-*'
    paths:
      - 'rust/**'
      - 'CLAUDE.md'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'CLAUDE.md'
      - '.github/workflows/rust-ci.yml'
  workflow_dispatch:

jobs:
  rust:
    name: Build, lint, test (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format Rust source for compact references (temporary)
        run: cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Emit formatted compact reference files (temporary)
        shell: pwsh
        run: |
          foreach ($file in @('rust/src/outlook/refs.rs', 'rust/src/outlook.rs', 'rust/src/outlook/mailbox.rs', 'rust/src/contracts.rs', 'rust/src/lib.rs')) {
            Write-Output "BEGIN_REF_STAGE $file"
            Write-Output ([Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path $file))))
            Write-Output "END_REF_STAGE $file"
          }
      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Lint
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Run unit tests
        run: cargo test --locked --manifest-path rust/Cargo.toml --all-targets
      - name: Build
        run: cargo build --locked --manifest-path rust/Cargo.toml
      - name: Check that server help works
        shell: pwsh
        run: |
          & .\rust\target\debug\outlook-mcp-rs.exe --version
          & .\rust\target\debug\outlook-mcp-rs.exe --help
