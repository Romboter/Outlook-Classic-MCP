name: Python tool contracts (no Outlook)

on:
  push:
    branches:
      - 'feat/python-tool-schema-snapshot-*'
    paths:
      - 'scripts/verify_python_contract_snapshot.py'
      - 'tests/test_python_contract_snapshot.py'
      - 'src/outlook_mcp/tools/**'
      - 'rust/compatibility/python-*.json'
      - '.github/workflows/python-contract-ci.yml'
  pull_request:
    paths:
      - 'scripts/verify_python_contract_snapshot.py'
      - 'tests/test_python_contract_snapshot.py'
      - 'src/outlook_mcp/tools/**'
      - 'rust/compatibility/python-*.json'
      - '.github/workflows/python-contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-declarations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all Python signatures against committed snapshot
        run: python scripts/verify_python_contract_snapshot.py --static
      - name: Run snapshot and redacted fixture regression tests
        run: python -m unittest discover -s tests -p 'test_python_contract_snapshot.py' -v

  fastmcp-registration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python tool-registration dependencies
        run: python -m pip install -e .
      - name: Capture registered FastMCP contract without Outlook
        run: python scripts/verify_python_contract_snapshot.py --capture-runtime
      - name: Emit source-only registration metadata for snapshot review
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          content = json.dumps(
              json.loads(Path("rust/compatibility/python-tools.runtime.json").read_text(encoding="utf-8")),
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          )
          for offset in range(0, len(content), 5000):
              print(f"RUNTIME_METADATA_PART:{offset//5000:04d}:{content[offset:offset+5000]}")
          PY
      - name: Compare actual FastMCP metadata against checked-in snapshot
        run: python scripts/verify_python_contract_snapshot.py --runtime
