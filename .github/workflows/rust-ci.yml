name: Rust Foundation CI

on:
  push:
    branches:
      - 'feat/rust-*'
      - 'fix/rust-*'
    paths:
      - 'rust/**'
      - 'CLAUDE.md'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'CLAUDE.md'
      - '.github/workflows/rust-ci.yml'
  workflow_dispatch:

jobs:
  rust:
    name: Build, lint, test (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Generate provisional lockfile (must be committed before closing #2)
        run: cargo generate-lockfile --manifest-path rust/Cargo.toml
      - name: Emit provisional lockfile for review (temporary)
        shell: pwsh
        run: |
          Write-Output 'BEGIN_OUTLOOK_LOCKFILE_B64'
          $raw = [System.IO.File]::ReadAllBytes((Resolve-Path rust/Cargo.lock))
          Write-Output ([Convert]::ToBase64String($raw))
          Write-Output 'END_OUTLOOK_LOCKFILE_B64'
      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Lint
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Run unit tests
        run: cargo test --manifest-path rust/Cargo.toml --all-targets
      - name: Build
        run: cargo build --manifest-path rust/Cargo.toml
      - name: Check that server help works
        shell: pwsh
        run: |
          & .\rust\target\debug\outlook-mcp-rs.exe --version
          & .\rust\target\debug\outlook-mcp-rs.exe --help
