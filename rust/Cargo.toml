[package]
name = "outlook-classic-mcp-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Windows-native Rust rewrite of Outlook Classic MCP (foundation stage)"
license = "MIT"
publish = false

[[bin]]
name = "outlook-mcp-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
